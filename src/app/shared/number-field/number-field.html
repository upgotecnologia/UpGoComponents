<div [formGroup]="form">
  <mat-form-field appearance="outline" floatLabel="always" class="number-field">
    <mat-label>{{ label }}</mat-label>

    <mat-icon *ngIf="prefixIcon" matPrefix>{{ prefixIcon }}</mat-icon>

    <input
      matInput
      type="number"
      [formControlName]="controlName"
      [placeholder]="placeholder || label"
      [disabled]="disabled"
      [min]="min"
      [max]="max"
      [step]="step"
    />

    <mat-icon *ngIf="suffixIcon" matSuffix>{{ suffixIcon }}</mat-icon>

    <mat-error *ngIf="getErrorMessage()">{{ getErrorMessage() }}</mat-error>
  </mat-form-field>
</div>
