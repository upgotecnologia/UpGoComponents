<main class="main">
  <div class="form-card">
    <h1>Cadastro</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid-form">
      <app-text-field
        [form]="form"
        controlName="fullName"
        label="Nome"
        placeholder="Digite seu nome"
        prefixIcon="person"
      />

      <app-text-field
        [form]="form"
        controlName="cpf"
        label="CPF"
        placeholder="Digite seu CPF"
        [mask]="'000.000.000-00'"
      />

      <app-number-field [form]="form" controlName="age" label="Idade" prefixIcon="event" />

      <app-password-field [form]="form" controlName="password" label="Senha" prefixIcon="lock" />

      <app-select-field
        [form]="form"
        controlName="role"
        label="Perfil"
        [options]="roleOptions"
        prefixIcon="badge"
      />

      <app-search-field [form]="form" controlName="search" label="Buscar" />

      <app-date-field [form]="form" controlName="date" label="Data" />

      <app-time-field [form]="form" controlName="time" label="Hora" />

      <app-text-field-area
        class="full-row"
        [form]="form"
        controlName="about"
        label="Sobre"
        [rows]="4"
      />

      <div class="actions full-row">
        <button type="submit">Enviar</button>
      </div>
    </form>

    <hr />

    <h2>Registros</h2>

    <app-table [columns]="tableColumns" [data]="tableData"> </app-table>
    <app-paginated-table [columns]="tableColumns" [data]="tableData" [pageSize]="5">
    </app-paginated-table>
  </div>
</main>
